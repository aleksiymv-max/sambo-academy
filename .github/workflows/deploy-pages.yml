name: Deploy demo to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test artifact staging safety
        run: python3 -m unittest discover -s scripts -p 'test_stage_pages.py'
      - name: Stage explicit public artifact
        run: python3 scripts/stage-pages.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
