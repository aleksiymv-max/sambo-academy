name: Prepublication history and privacy gate
# Manual, non-deploying audit. Requires a full clone; ordinary PR validation
# deliberately does not rewrite or purge historical commits.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all reachable branches and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm complete history is available
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          git branch -r
      - name: Run scanner self-test
        run: node scripts/check-repo-privacy.cjs --self-test
      - name: Block on tracked-file or reachable-history disclosures
        run: node scripts/check-repo-privacy.cjs --history
      - name: Explain remaining manual publication blockers
        if: always()
        run: |
          echo 'This workflow does not deploy, rewrite Git history, or rotate secrets.'
          echo 'Check inaccessible PR refs/forks, binary EXIF, faces, image licenses,'
          echo 'Supabase permissions and premium JS exposure separately.'
          echo 'A passing run alone is NOT authorization to publish.'
