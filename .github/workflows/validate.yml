name: Validate demo
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static demo
        run: |
          test -s index.html
          grep -q 'САМБО' index.html
          grep -q 'athlete' index.html
          grep -q 'judge' index.html
