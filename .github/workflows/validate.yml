name: Validate Sambo Academy
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax and core features
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (scripts.length < 3) throw new Error('Expected embedded JavaScript blocks');
          for (let i = 0; i < scripts.length; i++) {
            new vm.Script(scripts[i][1], {filename:'inline-'+i+'.js'});
          }
          const required = ['function openCourse(', 'function openLesson(', 'function samboLessonSections(', 'function startModuleQuiz(', 'function samboCitedArticlePanel(', 'function finishModuleQuiz('];
          for (const token of required) if (!html.includes(token)) throw new Error('Missing critical feature: '+token);
          if (!html.includes('samboLearningObjectives')) throw new Error('Missing lesson objectives');
          if (!html.includes('samboActiveQuiz')) throw new Error('Missing shuffled exam logic');
          if (!/function answer\(i,j\)[\s\S]*?const qs=samboActiveQuiz,p=qs\[currentQuestion\]/.test(html)) throw new Error('Quiz grading must use displayed shuffled question');
          // Check that displayed options and grading refer to the same shuffled attempt.
          const quizStart = html.indexOf('function startModuleQuiz()');
          const quizAnswer = html.indexOf('function answer(i,j)');
          const quizFinish = html.indexOf('function finishModuleQuiz()');
          const quizBlock = html.slice(quizStart,quizFinish);
          if (!quizBlock.includes('samboActiveQuiz=samboShuffle(')) throw new Error('Quiz shuffle missing');
          if (!/function renderModuleQuestion\(\)[\s\S]*?const qs=samboActiveQuiz/.test(quizBlock)) throw new Error('Rendered quiz does not use shuffled questions');
          if (!/function answer\(i,j\)[\s\S]*?const qs=samboActiveQuiz/.test(quizBlock)) throw new Error('Grading does not use shuffled questions');
          if (!quizBlock.includes('samboQuizMistakes.push')) throw new Error('Mistake review collection missing');
          const sample=[{label:'A',isCorrect:false},{label:'B',isCorrect:true},{label:'C',isCorrect:false}];
          for (let t=0;t<100;t++) {
            const arr=sample.slice().sort(()=>Math.random()-0.5);
            const index=arr.findIndex(x=>x.isCorrect);
            if (index<0 || arr[index].label!=='B') throw new Error('Answer mapping failed');
          }
          const curriculumChecks = [
            'function samboOfficialScoringMatrix(group)',
            'function samboBoundaryVisualLesson(group)',
            'const samboMatrixExam=',
            'function samboRefereeLab(group)'
          ];
          for (const token of curriculumChecks) if (!html.includes(token)) throw new Error('Missing advanced curriculum: '+token);
          for (const token of ['Чистый бросок','4 балла','2 балла','1 балл','Без оценки']) {
            if (!html.includes(token)) throw new Error('Missing scoring category: '+token);
          }
          if (!html.includes('topicIndex:topic')) throw new Error('Missing per-topic navigation markers');
          if (!html.includes('sections.findIndex(x=>x.topicIndex===topicIndex)')) throw new Error('Topic navigation must select the requested lesson');
          if (html.includes("Math.floor(topicIndex/3)")) throw new Error('Incorrect grouped topic navigation remains');
          if (!html.includes("Promise.resolve(saveSamboProgress(")) throw new Error('Result must wait for cloud save');
          if (!html.includes("status:'pending'")) throw new Error('Guardian application must begin pending');
          if (!html.includes("['guardian_pending','child_learner'].includes(")) throw new Error('Minor account access must depend on approval');
          const progress = fs.readFileSync('progress.js','utf8');
          new vm.Script(progress, {filename:'progress.js'});
          if (!progress.includes('return true;') || !progress.includes('return false;')) throw new Error('Progress storage must return a success state');
          const judgeSource = fs.readFileSync('judge-foundations.js','utf8');
          new vm.Script(judgeSource, {filename:'judge-foundations.js'});
          const foundationTerms=['Нормативная основа: как судья','Положение о соревнованиях: что проверить','Характер соревнований: личный','Группы, подгруппы и жеребьёвка','Пять способов проведения','Судейский практикум: от Положения'];
          for (const term of foundationTerms) if(!judgeSource.includes(term)) throw new Error('Missing judge module lesson: '+term);
          if(!html.includes('group.premiumFoundations')) throw new Error('Premium judge lesson routing missing');
          if(!html.includes('samboModuleProgressIndex(')) throw new Error('Versioned module progress missing');
          if(!html.includes('judge-foundations.css') || !html.includes('judge-foundations.js')) throw new Error('Judge assets missing');
          const programFiles=[
            'judge-course-engine.js',
            'judge-program-admission.js',
            'judge-program-participants.js',
            'judge-program-officials.js',
            'judge-program-bout.js',
            'judge-program-scoring.js',
            'judge-program-sanctions.js',
            'judge-program-infrastructure.js',
            'judge-program-combat.js',
            'judge-program-beach.js',
            'judge-program-demo.js',
            'judge-program-practicum.js',
            'judge-exam-independent.js',
            'judge-program-bridge.js'
          ];
          const sandbox={window:{}};vm.createContext(sandbox);
          for(const name of programFiles){
            const code=fs.readFileSync(name,'utf8');
            new vm.Script(code,{filename:name});
            if(name!=='judge-program-bridge.js')vm.runInContext(code,sandbox,{filename:name});
            if(!html.includes('src="'+name+'"')) throw new Error('Course file not loaded on site: '+name);
          }
          const modules=sandbox.window.samboJudgeCourseEngine.modules;
          if(modules.length!==11)throw new Error('Expected 11 expanded judge modules; got '+modules.length);
          const lessons=modules.reduce((n,m)=>n+m.lessons.length,0);
          if(lessons<50)throw new Error('Missing authored judge lessons: '+lessons);
          for(const m of modules){
           if(!m.questions.length)throw new Error('Empty exam: '+m.title);
           for(const lesson of m.lessons){
            if(!lesson.ref||!lesson.blocks?.length||!lesson.checks?.length||!lesson.decision)throw new Error('Incomplete lesson: '+lesson.title);
            for(const q of lesson.checks)if(!Array.isArray(q[1])||q[2]<0||q[2]>=q[1].length)throw new Error('Bad answer mapping: '+lesson.title);
           }
          }
          // Execute the bridge, not just parse it: otherwise valid files may still fail to appear in the course.
          const oldGroups=Array.from({length:10},(_,i)=>({title:'Legacy '+i,parts:[{title:'Legacy lesson'}]}));
          oldGroups[0]={title:'Foundation',parts:Array.from({length:6},(_,i)=>({title:'Foundation '+i})),progressIndex:1100};
          const integration={window:sandbox.window,
            samboModuleData:key=>key==='judge'?oldGroups.map(g=>({...g})):[],
            samboQuizQuestions:()=>[],
            samboLessonSections:()=>[]
          };
          vm.createContext(integration);
          vm.runInContext(fs.readFileSync('judge-program-bridge.js','utf8'),integration);
          const allGroups=integration.samboModuleData('judge');
          if(allGroups.length!==12)throw new Error('Expected 12 visible judge modules; got '+allGroups.length);
          for(let i=0;i<modules.length;i++){
            const group=allGroups[i+1],module=modules[i];
            if(group.title!==module.title||group.parts.length!==module.lessons.length)throw new Error('Bridge lost lessons: '+module.title);
            if(group.progressIndex!==1201+i)throw new Error('Progress key collision: '+module.title);
            if(integration.samboQuizQuestions(group).length!==module.questions.length)throw new Error('Exam not routed: '+module.title);
            const sections=integration.samboLessonSections(group);
            if(sections.length!==module.lessons.length+2||!sections.at(-1).quiz)throw new Error('Lesson/exam sections not routed: '+module.title);
            if(!sections[1].html.includes('СУДЕЙСКАЯ СИТУАЦИЯ'))throw new Error('Case study not rendered: '+module.title);
          }
          console.log('PASS: 12 visible judge modules, bridge routing, '+lessons+' authored expanded lessons, independent progress keys');
          console.log('PASS: '+(lessons+6)+' full judge lessons across '+(modules.length+1)+' modules, JS parsing and question integrity');
          console.log('PASS: '+scripts.length+' inline scripts, course navigation, result saving and guardian checks');
          NODE

      - name: Report editorial gaps without treating them as a validated course
        run: node scripts/audit-judge-content.cjs

      - name: Check demonstration sambo normative lesson coverage
        run: node scripts/check-demo-normative.cjs

      - name: Check beach sambo normative lesson coverage
        run: node scripts/check-beach-normative.cjs

      - name: Check combat sambo normative lesson coverage
        run: node scripts/check-combat-normative.cjs

      - name: Check 2026 sports-sambo activity amendment
        run: node scripts/check-activity-amendment.cjs
